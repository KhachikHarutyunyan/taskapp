
image:
  repository: ghcr.io/khachikharutyunyan/task-frontend
  tag: "bfe438138f058d0fcbf91b2bf487eea7e3dcad44"
  pullPolicy: IfNotPresent
# --- HPA ---
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
# --- HTTPRoute ---
httpRoute:
  enabled: true
  parentRefs:
    - name: main-gateway
      sectionName: http-taskapp
      namespace: infra-gateway
  hostnames:
    - taskapp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
# --- Ingress ---
ingress:
  enabled: false
# --- NetworkPolicy ---
networkpolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
  egress: []
