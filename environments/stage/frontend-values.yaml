
image:
  repository: ghcr.io/khachikharutyunyan/task-frontend
  tag: "7f02996887db0f91950d2d3e242fdfc6b34e6bfc"
  pullPolicy: IfNotPresent
# --- HPA ---
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 20
# --- HTTPRoute ---
httpRoute:
  enabled: false
# --- Ingress ---
ingress:
  enabled: true
  hosts:
    - host: taskapp.stage.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: taskapp-frontend-svc
              port:
                number: 8080
# --- NetworkPolicy ---
networkpolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress: []
