
replicaCount: 2

image:
  repository: ghcr.io/khachikharutyunyan/task-frontend
  tag: "b14a969796bcea5de0e35211c931c6bcc7552224"
  pullPolicy: IfNotPresent

# --- HPA ---

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 20


# --- HTTPRoute ---

httpRoute:
  enabled: false

# --- Ingress ---

ingress:
  enabled: true

# --- NetworkPolicy ---

networkpolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress: []