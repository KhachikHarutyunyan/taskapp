
replicaCount: 2
image:
  repository: ghcr.io/khachikharutyunyan/task-frontend
  tag: "ccc91bfdd050d22f6d5e93afa37602d603c53b49"
  pullPolicy: IfNotPresent

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    deny: ["ALL"]

# --- HPA ---
autoscaling:
  enabled: false
# --- HTTPRoute ---
httpRoute:
  enabled: false
# --- Ingress ---
ingress:
  enabled: true
# --- NetworkPolicy ---
networkpolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress: []
