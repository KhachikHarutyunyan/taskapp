apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: "https://github.com/KhachikHarutyunyan/taskapp.git"
    targetRevision: HEAD
    path: charts/backend
    helm:
      valueFiles:
        - ../../environments/dev/backend-values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: 'dev'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true