apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: "https://charts.bitnami.com/bitnami"
      chart: postgresql
      targetRevision: 18.12.1
      helm:
        valueFiles:
          - $values/environments/stage/postgresql-values.yaml
    - repoURL: "https://github.com/KhachikHarutyunyan/taskapp.git"
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: stage
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true