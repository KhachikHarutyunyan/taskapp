apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: "https://valkey.io/valkey-helm/"
      chart: valkey
      targetRevision: 0.12.0
      helm:
        valueFiles:
          - $values/environments/stage/valkey-values.yaml
    - repoURL: "https://github.com/KhachikHarutyunyan/taskapp.git"
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: stage
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true