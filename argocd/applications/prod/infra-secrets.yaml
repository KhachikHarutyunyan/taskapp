apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-infra-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: "https://github.com/KhachikHarutyunyan/taskapp.git"
    targetRevision: HEAD
    path: charts/taskapp-infra
    helm:
      valueFiles:
        - ../../environments/prod/infra-values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: prod
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true