

replicaCount: 1

image:
  repository: 192.168.56.10:30500/task-frontend
  pullPolicy: IfNotPresent
  tag: "1.0.7"

# --- SecurityContext ---
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# --- Liveness/Readiness probes and resources ---

readinessProbe:
  httpGet:
    path: /login
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /login
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 64Mi

# --- Service ---

service:
  type: ClusterIP
  port: 8080

# --- ServiceAccount ---

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: "frontend-sa"

# --- Ingress ---

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: taskapp.dev.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: taskapp-frontend-svc
              port:
                number: 8080

# --- HTTPRoute

httpRoute:
  enabled: true
  annotation: {}
  parentRefs:
  - name: main-gateway
    sectionName: http-taskapp
    namespace: infra-gateway
  hostname:
  - taskapp.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

# --- HPA ---

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# --- NetworkPolicy ---

networkpolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
  egress: []
